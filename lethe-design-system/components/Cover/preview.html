<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lethe — cover</title>
<style>
  html, body { margin: 0; background: var(--night); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--night); }
  svg { position: absolute; inset: 0; }
  .sentence { fill: var(--sentence); } .song { fill: var(--song); } .place { fill: var(--place); }
  .light { fill: var(--light); } .fog { fill: var(--fog); }
  .blk { rx: var(--radius-overlay); ry: var(--radius-overlay); }
  .lt { fill: var(--light); } .th { fill: var(--thread); }
  .txt { position: absolute; left: 40px; bottom: 32px; max-width: 440px; }
  .txt h1 { margin: 0; font: 300 112px/.92 var(--font-display); letter-spacing: -0.01em; color: var(--text-primary); }
  .txt p { margin: 8px 0 0; font: 400 14px/20px var(--font-sans); letter-spacing: .04em; color: var(--fog); }
</style></head>
<body>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: sentence 144x240 (space-6 + space-5, 10 x space-4), song 120x72, place 96x96 (space-6), light 48x48 (space-5), fog 144x72 bleeding right: the memory going to fog
         arrangement: one tall slab bleeding off the top with satellites stepping right and down, the last block already fog
         pattern: points of light (light and thread) as radius-pill discs on a space-4 (24px) grid, thinning rightward; Lethe is lit only by small lights that go out as it forgets, and the light counter is the same dot
         scales: space-4 24px pitch, space-5 48px, space-6 96px, radius-overlay 16px on blocks, radius-pill for the discs -->
    <rect class="sentence blk" x="528" y="-16" width="144" height="244"/>
    <rect class="song blk" x="696" y="36" width="120" height="72"/>
    <rect class="place blk" x="696" y="132" width="96" height="96"/>
    <rect class="light blk" x="840" y="84" width="48" height="48"/>
    <rect class="fog blk" x="840" y="156" width="144" height="72"/>
    <circle class="lt" cx="492" cy="156" r="2"/>
    <circle class="lt" cx="492" cy="204" r="2"/>
    <circle class="th" cx="492" cy="276" r="3"/>
    <circle class="lt" cx="516" cy="60" r="2"/>
    <circle class="lt" cx="516" cy="84" r="2"/>
    <circle class="lt" cx="516" cy="108" r="2"/>
    <circle class="lt" cx="540" cy="132" r="2"/>
    <circle class="lt" cx="564" cy="12" r="3"/>
    <circle class="lt" cx="564" cy="108" r="3"/>
    <circle class="lt" cx="564" cy="156" r="3"/>
    <circle class="lt" cx="564" cy="204" r="2"/>
    <circle class="th" cx="564" cy="228" r="2"/>
    <circle class="th" cx="588" cy="12" r="2"/>
    <circle class="lt" cx="588" cy="60" r="2"/>
    <circle class="th" cx="612" cy="12" r="2"/>
    <circle class="lt" cx="612" cy="132" r="2"/>
    <circle class="th" cx="636" cy="84" r="3"/>
    <circle class="lt" cx="660" cy="36" r="3"/>
    <circle class="lt" cx="660" cy="252" r="2"/>
    <circle class="lt" cx="684" cy="108" r="2"/>
    <circle class="lt" cx="684" cy="132" r="2"/>
    <circle class="lt" cx="684" cy="180" r="3"/>
    <circle class="lt" cx="708" cy="36" r="3"/>
    <circle class="lt" cx="708" cy="108" r="2"/>
    <circle class="lt" cx="708" cy="204" r="3"/>
    <circle class="lt" cx="756" cy="60" r="3"/>
    <circle class="th" cx="756" cy="252" r="2"/>
    <circle class="lt" cx="780" cy="180" r="2"/>
    <circle class="th" cx="852" cy="180" r="2"/>
    <circle class="lt" cx="876" cy="12" r="2"/>
    <circle class="th" cx="876" cy="36" r="2"/>
    <circle class="lt" cx="900" cy="60" r="3"/>
  </svg>
  <div class="txt">
    <h1>Lethe</h1>
    <p>A garden that forgets.</p>
  </div>
</div>
</body>
</html>
